[project]
name = "prusa-mcp"
version = "0.1.0"
description = "MCP server for 3D print management with PrusaLink integration"
readme = "README.md"
authors = [
    { name = "MarcheloSanchez", email = "131240732+MarcheloSanchez@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
prusa-mcp = "prusa_mcp:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
